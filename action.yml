name: okteto-oidc
description: okteto-oidc

inputs:
  url:
    required: true
  audience:
    required: false

runs:
  using: composite
  steps:
    - uses: actions/github-script@v9
      env:
        AUDIENCE: ${{ inputs.audience || inputs.url }}
      with:
        script: |
          const token = await core.getIDToken(process.env.AUDIENCE)
          core.setSecret(token)
          core.exportVariable('OKTETO_TOKEN', token)
    - run: curl https://get.okteto.com -sSfL | sh
      shell: bash
    - run: echo "OKTETO_URL=$URL" >> "$GITHUB_ENV"
      shell: bash
      env:
        URL: ${{ inputs.url }}
