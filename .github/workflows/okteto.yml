name: okteto

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  namespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          AUDIENCE: ${{ secrets.AUDIENCE }}
        with:
          script: |
            const token = await core.getIDToken(process.env.AUDIENCE)
            core.setSecret(token)
            core.exportVariable('OKTETO_TOKEN', token)
      - uses: docker://ghcr.io/okteto/okteto:stable
        env:
          OKTETO_URL: ${{ secrets.OKTETO_URL }}
        with:
          args: okteto namespace list
