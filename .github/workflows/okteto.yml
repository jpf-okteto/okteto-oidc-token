name: okteto

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  namespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: jpf-okteto/okteto-oidc-token@main
        with:
          url: ${{ secrets.OKTETO_URL }}
      - uses: docker://ghcr.io/okteto/okteto:stable
        with:
          args: okteto namespace list
