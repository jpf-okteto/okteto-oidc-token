on: workflow_dispatch

permissions:
  id-token: write

jobs:
  namespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: core.exportVariable('OKTETO_TOKEN', await core.getIDToken('${{ secrets.AUDIENCE }}'))
      - uses: docker://ghcr.io/okteto/okteto:stable
        env:
          OKTETO_URL: ${{ secrets.OKTETO_URL }}
        with:
          args: okteto namespace list
